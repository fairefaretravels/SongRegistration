<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Song Search — Record Label</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --deck:#14100D;
  --panel:#1E1812;
  --raised:#241D16;
  --line:#5A4A38;
  --line-soft:#3A3025;
  --paper:#F2E9DC;
  --dim:#B8AC98;
  --amber:#E8A33D;
  --green:#4FD387;
  --blue:#5B9BC7;
  --violet:#9F72BE;
  --red:#C1443C;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
}
body{
  min-height:100vh;
  background:
    radial-gradient(ellipse at top,#211810 0%,var(--deck) 58%);
  color:var(--paper);
  font-family:Inter,sans-serif;
}
button,input{
  font:inherit;
}
button{
  cursor:pointer;
}
a{
  color:inherit;
  text-decoration:none;
}
/* HEADER */
header{
  border-bottom:1px solid var(--line-soft);
  padding:18px 16px 14px;
  background:linear-gradient(180deg,#1b140f,transparent);
}
.header-inner{
  max-width:760px;
  margin:auto;
}
.eyebrow{
  font:600 10px 'IBM Plex Mono',monospace;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--amber);
}
h1{
  font:700 24px 'Space Grotesk',sans-serif;
  margin:4px 0 2px;
}
.sub{
  font-size:12px;
  color:var(--dim);
}
nav{
  max-width:760px;
  margin:12px auto 0;
  display:flex;
  gap:6px;
  overflow-x:auto;
}
.nav-btn{
  flex-shrink:0;
  border:1px solid var(--line-soft);
  background:var(--panel);
  color:var(--dim);
  border-radius:8px;
  padding:8px 11px;
  font:600 10px 'IBM Plex Mono',monospace;
  letter-spacing:.05em;
}
.nav-btn:hover{
  border-color:var(--line);
  color:var(--paper);
}
/* MAIN */
main{
  max-width:760px;
  margin:auto;
  padding:18px 14px 50px;
}
.search-panel{
  background:linear-gradient(180deg,var(--raised),var(--panel));
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
  box-shadow:0 10px 28px rgba(0,0,0,.25);
}
.search-label{
  font:600 10px 'IBM Plex Mono',monospace;
  letter-spacing:.14em;
  color:var(--dim);
  text-transform:uppercase;
  margin-bottom:9px;
}
.search-row{
  display:flex;
  gap:8px;
}
.search-input{
  flex:1;
  min-width:0;
  background:#0B0805;
  color:var(--paper);
  border:1px solid var(--line-soft);
  border-radius:9px;
  padding:12px 13px;
  outline:none;
}
.search-input:focus{
  border-color:var(--amber);
}
.search-input::placeholder{
  color:#756b5d;
}
.search-btn{
  background:var(--amber);
  color:#14100D;
  border:0;
  border-radius:9px;
  padding:0 17px;
  font-weight:700;
  font-family:'Space Grotesk',sans-serif;
}
.hint{
  margin-top:8px;
  color:#8f8475;
  font:10.5px 'IBM Plex Mono',monospace;
}
/* RESULTS */
.results-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:20px 2px 9px;
}
.results-title{
  font:700 13px 'Space Grotesk',sans-serif;
  color:var(--amber);
}
.count{
  color:var(--dim);
  font:10px 'IBM Plex Mono',monospace;
}
.result{
  background:var(--panel);
  border:1px solid var(--line-soft);
  border-radius:11px;
  padding:14px;
  margin-bottom:9px;
}
.result:hover{
  border-color:var(--line);
}
.result-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}
.song-title{
  font:600 16px 'Space Grotesk',sans-serif;
}
.artist{
  color:var(--dim);
  font-size:12px;
  margin-top:3px;
}
.status{
  flex-shrink:0;
  padding:4px 7px;
  border-radius:5px;
  background:rgba(232,163,61,.12);
  color:var(--amber);
  font:600 9px 'IBM Plex Mono',monospace;
}
.meta{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:10px;
}
.tag{
  border:1px solid var(--line-soft);
  color:var(--dim);
  border-radius:5px;
  padding:4px 7px;
  font:9px 'IBM Plex Mono',monospace;
}
.tag.ready{
  color:var(--green);
  border-color:rgba(79,211,135,.35);
}
.tag.stv{
  color:var(--blue);
  border-color:rgba(91,155,199,.35);
}
.tag.isr{
  color:var(--violet);
  border-color:rgba(159,114,190,.35);
}
audio{
  width:100%;
  height:34px;
  margin-top:11px;
}
.actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:10px;
}
.action{
  border:1px solid var(--line);
  background:var(--raised);
  color:var(--paper);
  border-radius:7px;
  padding:7px 10px;
  font:600 10px 'IBM Plex Mono',monospace;
}
.action.primary{
  background:var(--amber);
  border-color:var(--amber);
  color:#14100D;
}
.empty{
  text-align:center;
  border:1px dashed var(--line);
  border-radius:12px;
  padding:42px 20px;
  color:var(--dim);
}
.empty strong{
  display:block;
  color:var(--paper);
  font:600 16px 'Space Grotesk',sans-serif;
  margin-bottom:5px;
}
.empty span{
  font-size:12px;
}
.loading{
  text-align:center;
  padding:30px;
  color:var(--amber);
  font:11px 'IBM Plex Mono',monospace;
}
.error{
  background:rgba(193,68,60,.10);
  border:1px solid rgba(193,68,60,.45);
  color:#efaaa4;
  border-radius:9px;
  padding:11px 12px;
  font:11px 'IBM Plex Mono',monospace;
  line-height:1.5;
}
.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translateX(-50%) translateY(8px);
  opacity:0;
  pointer-events:none;
  background:var(--raised);
  border:1px solid var(--line);
  color:var(--paper);
  padding:9px 15px;
  border-radius:20px;
  font:11px 'IBM Plex Mono',monospace;
  transition:.2s;
  z-index:20;
}
.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
@media(max-width:520px){
  .search-row{
    display:grid;
    grid-template-columns:1fr;
  }
  .search-btn{
    height:42px;
  }
  .result-top{
    align-items:flex-start;
  }
}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="eyebrow">
      Record Label • Song Database
    </div>
    <h1>Song Search</h1>
    <div class="sub">
      Find registered songs without opening GitHub.
    </div>
    <nav>
      <a class="nav-btn" href="../">
        MAIN
      </a>
      <a class="nav-btn" href="../Press%20Desk%20AI/">
        PRESS DESK AI
      </a>
      <a class="nav-btn" href="../Command-Center/">
        COMMAND CENTER
      </a>
      <a class="nav-btn" href="../Home/">
        HOME
      </a>
    </nav>
  </div>
</header>
<main>
  <section class="search-panel">
    <div class="search-label">
      Search registered songs
    </div>
    <div class="search-row">
      <input
        id="searchInput"
        class="search-input"
        type="search"
        placeholder="Song title, artist, producer, genre, or ISRC..."
        autocomplete="off">
      <button
        id="searchBtn"
        class="search-btn">
        SEARCH
      </button>
    </div>
    <div class="hint">
      Leave blank and press SEARCH to show every registered song.
    </div>
  </section>
  <div class="results-head">
    <div class="results-title">
      REGISTERED SONGS
    </div>
    <div id="count" class="count">
      CONNECTING...
    </div>
  </div>
  <section id="results">
    <div class="loading">
      CONNECTING TO SONG DATABASE...
    </div>
  </section>
</main>
<div id="toast" class="toast"></div>
<script type="module">
import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyDm0UOhhugquxipVs-WUv8uLvK-eclJbSI",
  authDomain:
    "recordlabel-48b81.firebaseapp.com",
  projectId:
    "recordlabel-48b81",
  storageBucket:
    "recordlabel-48b81.firebasestorage.app",
  messagingSenderId:
    "338109981947",
  appId:
    "1:338109981947:web:e4db502810e7096cb33c5e",
  measurementId:
    "G-G2E9RT4REM"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
/* ================= ELEMENTS ================= */
const input =
  document.getElementById("searchInput");
const searchBtn =
  document.getElementById("searchBtn");
const results =
  document.getElementById("results");
const count =
  document.getElementById("count");
const toast =
  document.getElementById("toast");
let songs = [];
/* ================= HELPERS ================= */
function esc(value=""){
  return String(value)
    .replace(/[&<>"']/g, c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c]));
}
function normalize(value){
  return String(value || "")
    .toLowerCase()
    .trim();
}
function showToast(message){
  toast.textContent = message;
  toast.classList.add("show");
  setTimeout(() => {
    toast.classList.remove("show");
  },1800);
}
/* ================= RENDER ================= */
function render(list){
  count.textContent =
    `${list.length} RESULT${list.length === 1 ? "" : "S"}`;
  if(!list.length){
    results.innerHTML = `
      <div class="empty">
        <strong>No songs found</strong>
        <span>
          Try another title, artist, producer, genre, or ISRC.
        </span>
      </div>
    `;
    return;
  }
  results.innerHTML = list.map((song,index) => {
    const status =
      String(song.status || "DRAFT").toUpperCase();
    const title =
      song.title || "Untitled Song";
    const artist =
      song.artist || "Unknown Artist";
    const audio =
      song.audioUrl || "";
    const genre =
      song.genre || "";
    const producer =
      song.producer || "";
    const isrc =
      song.isrc || "";
    const rd =
      song.radioDelivery || {};
    return `
      <article class="result">
        <div class="result-top">
          <div>
            <div class="song-title">
              ${esc(title)}
            </div>
            <div class="artist">
              ${esc(artist)}
            </div>
          </div>
          <div class="status">
            ${esc(status)}
          </div>
        </div>
        <div class="meta">
          ${
            genre
            ? `<span class="tag">${esc(genre)}</span>`
            : ""
          }
          ${
            producer
            ? `<span class="tag">
                PROD: ${esc(producer)}
              </span>`
            : ""
          }
          ${
            isrc
            ? `<span class="tag">
                ISRC: ${esc(isrc)}
              </span>`
            : ""
          }
          ${
            status === "READY" ||
            status === "REGISTERED"
            ? `<span class="tag ready">
                RADIO READY
              </span>`
            : ""
          }
          ${
            rd.stvOnAir
            ? `<span class="tag stv">
                STV-ONAIR READY
              </span>`
            : ""
          }
          ${
            rd.islandSpice
            ? `<span class="tag isr">
                ISLAND SPICE READY
              </span>`
            : ""
          }
        </div>
        ${
          audio
          ? `
            <audio
              controls
              preload="none"
              src="${esc(audio)}">
            </audio>
          `
          : ""
        }
        <div class="actions">
          ${
            audio
            ? `
              <button
                class="action primary"
                data-copy="${esc(audio)}">
                COPY AUDIO URL
              </button>
            `
            : ""
          }
          <button
            class="action"
            data-copy-song="${index}">
            COPY SONG INFO
          </button>
          <a
            class="action"
            href="../Press%20Desk%20AI/?song=${encodeURIComponent(song.id || "")}">
            PRESS DESK AI
          </a>
        </div>
      </article>
    `;
  }).join("");
  /* COPY AUDIO */
  results
    .querySelectorAll("[data-copy]")
    .forEach(btn => {
      btn.addEventListener("click",async () => {
        try{
          await navigator.clipboard
            .writeText(btn.dataset.copy);
          showToast("AUDIO URL COPIED");
        }catch{
          showToast("COPY FAILED");
        }
      });
    });
  /* COPY SONG INFO */
  results
    .querySelectorAll("[data-copy-song]")
    .forEach(btn => {
      btn.addEventListener("click",async () => {
        const song =
          list[Number(btn.dataset.copySong)];
        const text = [
          `Song: ${song.title || ""}`,
          `Artist: ${song.artist || ""}`,
          `Producer: ${song.producer || ""}`,
          `Genre: ${song.genre || ""}`,
          `Release Date: ${song.releaseDate || ""}`,
          `ISRC: ${song.isrc || ""}`,
          `Status: ${song.status || ""}`,
          `Audio: ${song.audioUrl || ""}`,
          `Cover: ${song.coverUrl || ""}`
        ].join("\n");
        try{
          await navigator.clipboard
            .writeText(text);
          showToast("SONG INFO COPIED");
        }catch{
          showToast("COPY FAILED");
        }
      });
    });
}
/* ================= SEARCH ================= */
function search(){
  const term =
    normalize(input.value);
  if(!term){
    render(songs);
    return;
  }
  const filtered =
    songs.filter(song => {
      const haystack = [
        song.title,
        song.artist,
        song.producer,
        song.genre,
        song.isrc,
        song.status
      ]
      .map(normalize)
      .join(" ");
      return haystack.includes(term);
    });
  render(filtered);
}
/* ================= LOAD FIRESTORE ================= */
async function loadSongs(){
  try{
    const ref =
      collection(db,"songs");
    const snap =
      await getDocs(ref);
    songs =
      snap.docs.map(doc => ({
        id:doc.id,
        ...doc.data()
      }));
    songs.sort((a,b) =>
      normalize(a.title)
        .localeCompare(
          normalize(b.title)
        )
    );
    render(songs);
  }catch(error){
    console.error(error);
    count.textContent =
      "DATABASE ERROR";
    results.innerHTML = `
      <div class="error">
        Could not read the
        <strong>songs</strong>
        collection.
        <br><br>
        Check that Firestore is enabled
        and your rules allow this page
        to read the songs collection.
      </div>
    `;
  }
}
/* ================= EVENTS ================= */
searchBtn.addEventListener(
  "click",
  search
);
input.addEventListener(
  "input",
  search
);
input.addEventListener(
  "keydown",
  event => {
    if(event.key === "Enter"){
      search();
    }
  }
);
/* START */
loadSongs();
</script>
</body>
</html>
